<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #ffffff;
      padding: 30px;
      font-family: Arial, Helvetica, sans-serif;
    }
    #diagram {
      display: inline-block;
    }
    svg {
      max-width: none !important;
      height: auto !important;
    }
  </style>
</head>
<body>
  <div id="diagram">
    <pre class="mermaid" id="mermaid-code">
    </pre>
  </div>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'default',
      er: {
        useMaxWidth: false,
        fontSize: 14
      }
    });

    window.renderDiagram = async function(code) {
      const el = document.getElementById('mermaid-code');
      el.textContent = code;
      await mermaid.run({ nodes: [el] });
      document.title = 'RENDERED_DONE';
    };
  </script>
</body>
</html>
